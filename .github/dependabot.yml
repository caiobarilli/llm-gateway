version: 2

updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      docker-major:
        patterns:
          - "*"
        update-types:
          - major
      docker:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      uv-major:
        patterns:
          - "*"
        update-types:
          - major
      uv:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
      github-actions:
        patterns:
          - "*"
